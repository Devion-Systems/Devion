version: '3.9'

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: Devion-DB
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_onprem_secure_default}
      POSTGRES_DB: ${DB_NAME:-devion_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - Devion-network

  registry:
    image: registry:2
    container_name: Devion-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - Devion-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: Devion-storage
    restart: unless-stopped
    entrypoint: [ "/usr/local/bin/rustfs", "--console-enable", "/data" ]
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API Endpunkt
      - "${CONSOLE_PORT:-9001}:9001"    # RustFS Web-Konsole
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-onprem_access_key}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-onprem_secret_key_must_be_long}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs_data:/data
    networks:
      - Devion-network

volumes:
  postgres_data:
    driver: local
  registry_data:
    driver: local
  rustfs_data:
    driver: local

networks:
  Devion-network:
    driver: bridge