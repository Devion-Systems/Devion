version: '3.9'

services:
  traefik:
    image: traefik:v3.1
    container_name: Devion-traefik
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - Devion-network

  postgres:
    image: postgres:18.4-alpine
    container_name: Devion-DB
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_onprem_secure_default}
      POSTGRES_DB: ${DB_NAME:-devion_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - Devion-network

  registry:
    image: registry:2
    container_name: Devion-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - Devion-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.devion.local`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls=true" # Aktiviert TLS mit generierten Zertifikaten
      - "traefik.http.services.registry.loadbalancer.server.port=5000"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: Devion-storage
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API Endpunkt
      - "${CONSOLE_PORT:-9001}:9001"    # RustFS Web-Konsole
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-onprem_access_key}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-onprem_secret_key_must_be_long}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs_data:/data
    networks:
      - Devion-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage.rule=Host(`storage.devion.local`)"
      - "traefik.http.routers.storage.entrypoints=websecure"
      - "traefik.http.routers.storage.tls=true"
      - "traefik.http.services.storage.loadbalancer.server.port=9000"

volumes:
  postgres_data:
    driver: local
  registry_data:
    driver: local
  rustfs_data:
    driver: local

networks:
  Devion-network:
    driver: bridge