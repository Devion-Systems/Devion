name: devion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [devion]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
    volumes:
      - rustfs-data:/data
    networks: [devion]

  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry-data:/var/lib/registry
    networks: [devion]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [devion]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      API_PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN}
      DASHBOARD_URL: ${DASHBOARD_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL}
      TRAEFIK_ENABLED: ${TRAEFIK_ENABLED}
      TRAEFIK_DYNAMIC_CONFIG_DIR: ${TRAEFIK_DYNAMIC_CONFIG_DIR}
      TRAEFIK_CERTS_DIR: ${TRAEFIK_CERTS_DIR}
      TRAEFIK_CERTS_TRAEFIK_DIR: ${TRAEFIK_CERTS_TRAEFIK_DIR}
      TRAEFIK_INTERNAL_DOMAIN: ${TRAEFIK_INTERNAL_DOMAIN}
      TRAEFIK_PROJECT_UPSTREAM_TEMPLATE: ${TRAEFIK_PROJECT_UPSTREAM_TEMPLATE}
      TRAEFIK_CNAME_TARGET: ${TRAEFIK_CNAME_TARGET}
    volumes:
      - ../../data/traefik/dynamic:/data/traefik/dynamic
      - ../../data/traefik/certs:/data/traefik/certs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/health')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      # HTTP and HTTPS need distinct routers. A TLS router must not be reused
      # for requests received on the plaintext `web` entrypoint.
      - traefik.http.routers.devion-api-http.rule=Host(`${API_HOST}`)
      - traefik.http.routers.devion-api-http.entrypoints=web
      - traefik.http.routers.devion-api-https.rule=Host(`${API_HOST}`)
      - traefik.http.routers.devion-api-https.entrypoints=websecure
      - traefik.http.routers.devion-api-https.tls=true
      - traefik.http.services.devion-api.loadbalancer.server.port=3000
    networks: [devion]

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
      args:
        # HTTP is the safe local default. Set PUBLIC_API_URL=https://api.example.com
        # for a deployment with a trusted TLS certificate.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://${API_HOST}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/login')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.devion-dashboard-http.rule=Host(`${DASHBOARD_HOST}`)
      - traefik.http.routers.devion-dashboard-http.entrypoints=web
      - traefik.http.routers.devion-dashboard-https.rule=Host(`${DASHBOARD_HOST}`)
      - traefik.http.routers.devion-dashboard-https.entrypoints=websecure
      - traefik.http.routers.devion-dashboard-https.tls=true
      - traefik.http.services.devion-dashboard.loadbalancer.server.port=3000
    networks: [devion]

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../data/traefik/dynamic:/etc/traefik/dynamic:ro
      - ../../data/traefik/certs:/etc/traefik/certs:ro
      - ../../data/traefik/acme:/letsencrypt
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks: [devion]

volumes:
  postgres-data:
  rustfs-data:
  registry-data:

networks:
  devion:
    name: devion
