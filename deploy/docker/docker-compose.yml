name: devion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [devion]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
    volumes:
      - rustfs-data:/data
    networks: [devion]

  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    networks: [devion]

  buildkit:
    image: moby/buildkit:v0.25.2-rootless
    restart: unless-stopped
    command: ["--addr", "tcp://0.0.0.0:1234"]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - builder-buildkit:/home/user/.local/share/buildkit
    networks: [devion]

  builder-api:
    build:
      context: ../../apps/builder
      dockerfile: Dockerfile
    command: ["bun", "src/api.ts"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BUILDER_API_TOKEN: ${BUILDER_API_TOKEN}
      BUILDKIT_ADDRESS: tcp://buildkit:1234
      BUILDER_WORKDIR: /workspaces
      PORT: 3010
    depends_on:
      postgres:
        condition: service_healthy
    networks: [devion]

  builder-worker:
    build:
      context: ../../apps/builder
      dockerfile: Dockerfile
    command: ["bun", "src/worker.ts"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BUILDER_API_TOKEN: ${BUILDER_API_TOKEN}
      BUILDKIT_ADDRESS: tcp://buildkit:1234
      BUILDER_WORKDIR: /workspaces
      WORKER_CONCURRENCY: ${BUILDER_WORKER_CONCURRENCY:-2}
    volumes:
      - builder-workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      buildkit:
        condition: service_started
    networks: [devion]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Migrations are an explicit install/update step, never a long-running
    # application dependency. `docker compose run --rm migrate` must finish
    # successfully before a new control plane is started.
    profiles: ["maintenance"]
    networks: [devion]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      API_PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN}
      DEVION_SETUP_TOKEN: ${DEVION_SETUP_TOKEN:-}
      DASHBOARD_URL: ${DASHBOARD_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Company SSO}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OIDC_ALLOW_SIGN_UP: ${OIDC_ALLOW_SIGN_UP:-false}
      OIDC_PROMPT: ${OIDC_PROMPT:-}
      HIBP_ENABLED: ${HIBP_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL}
      TRAEFIK_ENABLED: ${TRAEFIK_ENABLED}
      TRAEFIK_DYNAMIC_CONFIG_DIR: ${TRAEFIK_DYNAMIC_CONFIG_DIR}
      TRAEFIK_CERTS_DIR: ${TRAEFIK_CERTS_DIR}
      TRAEFIK_CERTS_TRAEFIK_DIR: ${TRAEFIK_CERTS_TRAEFIK_DIR}
      TRAEFIK_INTERNAL_DOMAIN: ${TRAEFIK_INTERNAL_DOMAIN}
      TRAEFIK_PROJECT_UPSTREAM_TEMPLATE: ${TRAEFIK_PROJECT_UPSTREAM_TEMPLATE}
      TRAEFIK_CNAME_TARGET: ${TRAEFIK_CNAME_TARGET}
      SYSTEM_UPDATER_CONTAINER: devion-updater
      SYSTEM_UPDATE_STATE_FILE: /data/system-updates/latest.json
      DATABASE_PUBLIC_HOST: ${DATABASE_PUBLIC_HOST:-}
      DEVION_LOCAL_AGENT_TOKEN: ${DEVION_LOCAL_AGENT_TOKEN}
      BUILDER_API_URL: http://builder-api:3010
      BUILDER_API_TOKEN: ${BUILDER_API_TOKEN}
      DEVION_BUILDER_IMAGE_PREFIX: registry:5000/devion
      DEVION_BUILDER_REGISTRY_INSECURE: "true"
      DEVION_BUILD_IMAGE_PREFIX: ${DEVION_BUILD_IMAGE_PREFIX:-localhost:5000/devion}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data/system-updates:/data/system-updates
      - ../../data/traefik/dynamic:/data/traefik/dynamic
      - ../../data/traefik/certs:/data/traefik/certs
      # The current API socket mount is only used by the platform update flow.
      # Workloads are executed by node agents, never by the API process.
    depends_on:
      updater:
        condition: service_started
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/health')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      # The control plane is deliberately available on the host IP on first
      # boot. Custom domains are published by the API through the file provider.
      - traefik.http.routers.devion-api-http.rule=PathPrefix(`/api`) || PathPrefix(`/organizations`) || Path(`/health`)
      - traefik.http.routers.devion-api-http.entrypoints=web
      - traefik.http.routers.devion-api-http.priority=100
      - traefik.http.routers.devion-api-https.rule=PathPrefix(`/api`) || PathPrefix(`/organizations`) || Path(`/health`)
      - traefik.http.routers.devion-api-https.entrypoints=websecure
      - traefik.http.routers.devion-api-https.priority=100
      - traefik.http.routers.devion-api-https.tls=true
      - traefik.http.services.devion-api.loadbalancer.server.port=3000
    networks: [devion]

  updater:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.updater
    container_name: devion-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace
    networks: [devion]

  # The local agent is the only service that controls workload containers.
  # Before it is enrolled it waits safely for the one-shot Hardware flow.
  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["bun", "run", "--cwd", "apps/agent", "start"]
    restart: unless-stopped
    environment:
      DEVION_API_URL: http://api:3000
      DEVION_AGENT_NAME: ${DEVION_AGENT_NAME:-devion-local}
      DEVION_AGENT_DATA_DIR: /var/lib/devion-agent
      DEVION_LOCAL_AGENT_TOKEN: ${DEVION_LOCAL_AGENT_TOKEN}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/var/lib/devion-agent
    depends_on:
      api:
        condition: service_healthy
    networks: [devion]

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_OIDC_ENABLED: ${NEXT_PUBLIC_OIDC_ENABLED:-false}
        NEXT_PUBLIC_OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
        NEXT_PUBLIC_OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Company SSO}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/login')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.devion-dashboard-http.rule=PathPrefix(`/`)
      - traefik.http.routers.devion-dashboard-http.entrypoints=web
      - traefik.http.routers.devion-dashboard-http.priority=1
      - traefik.http.routers.devion-dashboard-https.rule=PathPrefix(`/`)
      - traefik.http.routers.devion-dashboard-https.entrypoints=websecure
      - traefik.http.routers.devion-dashboard-https.priority=1
      - traefik.http.routers.devion-dashboard-https.tls=true
      - traefik.http.services.devion-dashboard.loadbalancer.server.port=3000
    networks: [devion]

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      # Overrides the placeholder in traefik.yml. It is needed only once a
      # verified custom domain asks Traefik to obtain a Let's Encrypt certificate.
      - "--certificatesresolvers.le-kunden.acme.email=${TRAEFIK_ACME_EMAIL:-}"
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../data/traefik/dynamic:/etc/traefik/dynamic:ro
      - ../../data/traefik/certs:/etc/traefik/certs:ro
      - ../../data/traefik/acme:/letsencrypt
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks: [devion]

volumes:
  agent-data:
  builder-buildkit:
  builder-workspaces:
  postgres-data:
  rustfs-data:
  registry-data:

networks:
  devion:
    name: devion
