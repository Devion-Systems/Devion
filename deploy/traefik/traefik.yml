providers:
  # The platform services are declared through Compose labels. Keeping this
  # provider enabled also makes a plain `docker compose up` usable; the file
  # provider below remains responsible for project and certificate routes.
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: devion
  file:
    # Verweist auf das Verzeichnis, in dem deine Steuerungsebene (Control Plane)
    # die dynamischen Konfigurationen für die Firecracker-VMs ablegt.
    directory: "/etc/traefik/dynamic"
    watch: true

entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"

# Zertifikats-Manager für die automatische SSL-Ausstellung externer Kunden-Domains
certificatesResolvers:
  le-kunden:
    acme:
      email: "admin@devion.local"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web
