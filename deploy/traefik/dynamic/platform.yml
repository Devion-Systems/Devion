# Core platform routes are file-provider based so they work with both Linux
# Docker Engine and Docker Desktop. Project domain routes are added by the API
# to the same dynamic configuration directory.
http:
  routers:
    devion-api-http:
      rule: "HostRegexp(`^api\\..+$`)"
      entryPoints: [web]
      service: devion-api
    devion-api-https:
      rule: "HostRegexp(`^api\\..+$`)"
      entryPoints: [websecure]
      service: devion-api
      tls: {}
    devion-dashboard-http:
      rule: "HostRegexp(`^dashboard\\..+$`)"
      entryPoints: [web]
      service: devion-dashboard
    devion-dashboard-https:
      rule: "HostRegexp(`^dashboard\\..+$`)"
      entryPoints: [websecure]
      service: devion-dashboard
      tls: {}
  services:
    devion-api:
      loadBalancer:
        servers:
          - url: "http://api:3000"
    devion-dashboard:
      loadBalancer:
        servers:
          - url: "http://dashboard:3000"
