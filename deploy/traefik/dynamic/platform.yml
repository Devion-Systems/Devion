# The control plane works directly from the host IP. Project-domain routes are
# added by the API only after their DNS ownership has been verified.
http:
  routers:
    devion-api-http:
      rule: "PathPrefix(`/api`) || PathPrefix(`/organizations`) || Path(`/health`)"
      entryPoints: [web]
      priority: 100
      service: devion-api
    devion-api-https:
      rule: "PathPrefix(`/api`) || PathPrefix(`/organizations`) || Path(`/health`)"
      entryPoints: [websecure]
      priority: 100
      service: devion-api
      tls: {}
    devion-dashboard-http:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      priority: 1
      service: devion-dashboard
    devion-dashboard-https:
      rule: "PathPrefix(`/`)"
      entryPoints: [websecure]
      priority: 1
      service: devion-dashboard
      tls: {}
  services:
    devion-api:
      loadBalancer:
        servers:
          - url: "http://api:3000"
    devion-dashboard:
      loadBalancer:
        servers:
          - url: "http://dashboard:3000"
